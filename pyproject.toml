[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch-agent"
version = "0.1.0"
description = "Agent harness for a personal senior-AI-leadership job search: discover, score, tailor, verify, outreach, track."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DJ Human", email = "8077271+djhoomin@users.noreply.github.com" }]
dependencies = [
    "anthropic>=1.2.0",
    "pypdf>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
dev = ["pytest>=8.0"]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobsearch = ["data/*.toml", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
